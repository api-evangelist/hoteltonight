name: HotelTonight
description: >-
  HotelTonight is a last-minute hotel booking service, now part of Airbnb, that
  lets travelers discover and reserve same-day and near-term hotel deals across
  thousands of properties worldwide through its consumer mobile apps and website.
  For hotels, HotelTonight operates a partner (extranet) program and a private
  agent/partner API used to manage inventory, rates, and availability. The API
  surface is gated behind partner authentication (HTTP Basic auth at the partner
  documentation portal and an agent sign-in at api.hoteltonight.com); HotelTonight
  does not publish an open, self-service developer API, an OpenAPI/Swagger spec,
  first-party client SDKs, or a public /.well-known discovery surface. This API
  Evangelist profile was surfaced as a Battery Ventures portfolio company and
  enriched by probing the provider's real public surfaces.
